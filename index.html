<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cine & Series - Sergio y Alaia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .card-style {
      background-color: #1e293b;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .custom-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .custom-modal { align-items: center; padding: 16px; }
    }
    .custom-modal.active {
      display: flex !important;
    }
  </style>
</head>
<body class="pb-24">

  <!-- Pantalla de Selección de Usuario -->
  <div id="user-select-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center">
    <h2 class="text-2xl font-bold text-white mb-2">¿Quién está viendo?</h2>
    <p class="text-slate-400 text-xs mb-8">Elige tu perfil para ver tus contenidos</p>
    
    <div class="flex gap-6 sm:gap-10">
      <button onclick="selectUser('SERGIO')" class="group flex flex-col items-center focus:outline-none">
        <div class="w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full flex items-center justify-center p-1 border-2 border-white/20 group-active:scale-95 transition shadow-lg shadow-blue-500/20">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Sergio" class="w-full h-full rounded-full bg-slate-900 object-cover" alt="Sergio">
        </div>
        <span class="mt-3 font-bold text-slate-200 group-hover:text-pink-400 text-sm">Sergio</span>
      </button>

      <button onclick="selectUser('ALAIA')" class="group flex flex-col items-center focus:outline-none">
        <div class="w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-tr from-pink-600 to-purple-500 rounded-full flex items-center justify-center p-1 border-2 border-white/20 group-active:scale-95 transition shadow-lg shadow-pink-500/20">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alaia" class="w-full h-full rounded-full bg-slate-900 object-cover" alt="Alaia">
        </div>
        <span class="mt-3 font-bold text-slate-200 group-hover:text-pink-400 text-sm">Alaia</span>
      </button>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-white/10 p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <button onclick="showUserSelection()" class="text-xs bg-slate-800 text-pink-400 font-bold px-2.5 py-1 rounded-full border border-pink-500/30 flex items-center gap-1.5 active:scale-95 transition">
        <span id="active-user-icon">👤</span> <span id="active-user-name">Perfil</span>
      </button>
    </div>
    <button onclick="openAddModal()" type="button" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-1 shadow-lg shadow-pink-600/30 border border-white/20">
      <i class="fa-solid fa-plus"></i> Añadir
    </button>
  </header>

  <!-- Filtros Principales -->
  <nav id="filter-nav" class="flex gap-2 p-3 overflow-x-auto hide-scrollbar border-b border-white/10 bg-slate-950/80">
  </nav>

  <!-- Subfiltros de Tipo -->
  <div class="flex justify-center gap-2 px-4 py-2.5 bg-slate-900/50 border-b border-white/5">
    <button onclick="setMediaTypeFilter('ALL')" id="media-type-ALL" class="media-type-btn text-xs font-semibold px-3 py-1 rounded-lg bg-pink-600 text-white border border-white/20">🍿 Todo</button>
    <button onclick="setMediaTypeFilter('movie')" id="media-type-movie" class="media-type-btn text-xs font-semibold px-3 py-1 rounded-lg bg-slate-800 text-slate-400 border border-white/10">🎬 Películas</button>
    <button onclick="setMediaTypeFilter('tv')" id="media-type-tv" class="media-type-btn text-xs font-semibold px-3 py-1 rounded-lg bg-slate-800 text-slate-400 border border-white/10">📺 Series</button>
  </div>

  <!-- Catálogo -->
  <main id="content-grid" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="col-span-full text-center py-12 text-slate-500 text-sm">Cargando catálogo...</div>
  </main>

  <!-- Modal Añadir -->
  <div id="add-modal" class="custom-modal">
    <div class="bg-slate-900 border border-white/20 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-white">Añadir Película o Serie</h2>
        <button onclick="closeAddModal()" type="button" class="text-slate-400 hover:text-white text-2xl px-2">&times;</button>
      </div>

      <div class="flex gap-2 mb-3 bg-slate-950 p-1 rounded-xl border border-white/10">
        <button type="button" onclick="setSearchType('movie')" id="type-movie-btn" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-pink-600 text-white">🎬 Películas</button>
        <button type="button" onclick="setSearchType('tv')" id="type-tv-btn" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400">📺 Series</button>
      </div>

      <form onsubmit="executeSearch(event)" class="relative mb-2 flex gap-2">
        <input type="text" id="tmdb-search" placeholder="Escribe el nombre..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none text-white">
        <button type="submit" class="bg-pink-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold flex-shrink-0">Buscar</button>
      </form>

      <div class="flex justify-between items-center mb-3">
        <span id="status-msg" class="text-xs text-slate-400 hidden">Buscando...</span>
        <button type="button" onclick="addManualItem()" class="text-xs text-pink-400 hover:underline ml-auto">+ Añadir rápido manualmente</button>
      </div>

      <div id="search-results" class="flex-1 overflow-y-auto space-y-2 pr-1 hide-scrollbar max-h-60 mb-4"></div>

      <div id="selected-item-form" class="hidden border-t border-white/10 pt-4 space-y-3">
        <div class="flex items-center gap-3 bg-slate-950 p-2 rounded-xl border border-white/10">
          <img id="preview-img" src="" class="w-10 h-14 object-cover rounded-md">
          <div>
            <h4 id="preview-title" class="text-xs font-bold text-white"></h4>
            <p id="preview-type" class="text-[10px] text-pink-400 font-bold uppercase"></p>
          </div>
        </div>

        <p class="text-xs text-slate-400 font-semibold uppercase">¿Para quién es?</p>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-2 bg-slate-800 p-2 rounded-lg text-xs cursor-pointer border border-white/5">
            <input type="radio" name="category" value="SERGIO" class="accent-pink-500"> 👦 Solo Sergio
          </label>
          <label class="flex items-center gap-2 bg-slate-800 p-2 rounded-lg text-xs cursor-pointer border border-white/5">
            <input type="radio" name="category" value="ALAIA" class="accent-pink-500"> 👩 Solo Alaia
          </label>
          <label class="flex items-center gap-2 bg-slate-800 p-2 rounded-lg text-xs cursor-pointer border border-white/5">
            <input type="radio" name="category" value="JUNTOS" checked class="accent-pink-500"> 👩‍❤️‍👨 Para los Dos
          </label>
          <label class="flex items-center gap-2 bg-slate-800 p-2 rounded-lg text-xs cursor-pointer border border-white/5">
            <input type="radio" name="category" value="NIÑA" class="accent-pink-500"> 👧 Con la Niña
          </label>
        </div>

        <button type="button" id="save-btn" onclick="saveSelectedItem()" class="w-full bg-pink-600 hover:bg-pink-500 text-white py-2.5 rounded-xl text-sm font-semibold mt-2 border border-white/20">
          Guardar en la Lista
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bvqzsonynnrwwiywgnox.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Adn054C4cgLhzqoM7ZS7kQ_ZLNfkV0J";
    const TMDB_KEY = "8baba8ab6b8bbe247645bcae7df63d0d";

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    let currentUser = localStorage.getItem('app_user') || null;
    let currentFilter = null;
    let currentMediaTypeFilter = 'ALL';
    let searchType = 'movie';
    let mediaList = [];
    let tempSelectedItem = null;
    let tvDetailsCache = {};

    function selectUser(user) {
      currentUser = user;
      localStorage.setItem('app_user', user);
      document.getElementById('user-select-screen').classList.add('hidden');
      
      document.getElementById('active-user-name').innerText = user === 'SERGIO' ? 'Sergio' : 'Alaia';
      document.getElementById('active-user-icon').innerText = user === 'SERGIO' ? '👦' : '👩';

      setupFilterNav();
      fetchMedia();
    }

    function showUserSelection() {
      document.getElementById('user-select-screen').classList.remove('hidden');
    }

    function setupFilterNav() {
      const nav = document.getElementById('filter-nav');
      nav.innerHTML = '';

      let filters = [];
      if (currentUser === 'SERGIO') {
        filters = [
          { id: 'SERGIO', label: '👦 Sergio' },
          { id: 'JUNTOS', label: '👩‍❤️‍👨 Juntos' },
          { id: 'NIÑA', label: '👧 Con la Niña' }
        ];
      } else {
        filters = [
          { id: 'ALAIA', label: '👩 Alaia' },
          { id: 'JUNTOS', label: '👩‍❤️‍👨 Juntos' }
        ];
      }

      currentFilter = filters[0].id;

      filters.forEach((f, index) => {
        const btn = document.createElement('button');
        btn.id = `btn-${f.id}`;
        btn.onclick = () => setFilter(f.id);
        btn.className = index === 0 
          ? "filter-btn bg-pink-600 text-white px-4 py-1.5 rounded-full text-sm whitespace-nowrap font-medium border border-white/20"
          : "filter-btn bg-slate-800 text-slate-300 px-4 py-1.5 rounded-full text-sm whitespace-nowrap font-medium border border-white/10";
        btn.innerText = f.label;
        nav.appendChild(btn);
      });
    }

    function setMediaTypeFilter(type) {
      currentMediaTypeFilter = type;
      document.querySelectorAll('.media-type-btn').forEach(b => {
        b.className = "media-type-btn text-xs font-semibold px-3 py-1 rounded-lg bg-slate-800 text-slate-400 border border-white/10";
      });
      const activeBtn = document.getElementById(`media-type-${type}`);
      if (activeBtn) activeBtn.className = "media-type-btn text-xs font-semibold px-3 py-1 rounded-lg bg-pink-600 text-white border border-white/20";
      renderList();
    }

    function openAddModal() {
      document.getElementById('add-modal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('active');
      document.getElementById('selected-item-form').classList.add('hidden');
      document.getElementById('search-results').innerHTML = '';
      document.getElementById('tmdb-search').value = '';
    }

    function setSearchType(type) {
      searchType = type;
      const mBtn = document.getElementById('type-movie-btn');
      const tBtn = document.getElementById('type-tv-btn');
      if (type === 'movie') {
        mBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-pink-600 text-white";
        tBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400";
      } else {
        tBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-pink-600 text-white";
        mBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400";
      }
    }

    async function fetchMedia() {
      if (!supabaseClient || !currentUser) return;
      try {
        const { data, error } = await supabaseClient.from('media').select('*');
        if (!error && data) {
          mediaList = data;
          renderList();
          loadTvRealData();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadTvRealData() {
      const tvItems = mediaList.filter(item => item.type === 'tv' && item.tmdb_id);
      for (const item of tvItems) {
        if (tvDetailsCache[item.tmdb_id]) continue;
        try {
          const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdb_id}?api_key=${TMDB_KEY}&language=es-ES`);
          if (res.ok) {
            const data = await res.json();
            const seasons = (data.seasons || []).filter(s => s.season_number > 0);
            
            let badge = '';
            if (data.next_episode_to_air && data.next_episode_to_air.air_date) {
              const airDate = new Date(data.next_episode_to_air.air_date);
              badge = `🗓️ Próx: ${airDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;
            } else if (data.status === 'Ended' || data.status === 'Canceled') {
              badge = `✅ Finalizada`;
            } else {
              badge = `⏳ Sin fecha confirmada`;
            }

            tvDetailsCache[item.tmdb_id] = {
              seasons: seasons,
              badge: badge
            };

            renderList();
          }
        } catch(e) {}
      }
    }

    function calculateTotalPending(item, tvDetails) {
      if (!tvDetails || !tvDetails.seasons || tvDetails.seasons.length === 0) return 0;
      
      const currSeason = item.season || 1;
      const currEp = item.episode || 1;
      let totalPending = 0;

      tvDetails.seasons.forEach(s => {
        if (s.season_number === currSeason) {
          totalPending += Math.max(0, (s.episode_count || 0) - currEp);
        } else if (s.season_number > currSeason) {
          totalPending += (s.episode_count || 0);
        }
      });

      return totalPending;
    }

    function renderList() {
      const grid = document.getElementById('content-grid');
      if (!grid) return;
      grid.innerHTML = '';

      let filtered = mediaList.filter(item => {
        const matchCategory = item.category === currentFilter;
        const matchType = currentMediaTypeFilter === 'ALL' || item.type === currentMediaTypeFilter;
        return matchCategory && matchType;
      });

      filtered.sort((a, b) => {
        const aCompleted = a.completed ? 1 : 0;
        const bCompleted = b.completed ? 1 : 0;
        
        if (aCompleted !== bCompleted) return aCompleted - bCompleted;
        
        const aIsTv = a.type === 'tv' ? 0 : 1;
        const bIsTv = b.type === 'tv' ? 0 : 1;
        
        if (aIsTv !== bIsTv) return aIsTv - bIsTv;

        return (b.id || 0) - (a.id || 0);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">No hay nada guardado en esta sección. Toca "Añadir" para empezar.</div>`;
        return;
      }

      filtered.forEach((item) => {
        const isTV = item.type === 'tv';
        const isCompleted = item.completed || false;
        const faSearchUrl = `https://www.filmaffinity.com/es/search.php?stext=${encodeURIComponent(item.title)}`;
        const currentSeasonNum = item.season || 1;
        const currentEpisodeNum = item.episode || 1;

        const tvDetails = isTV && item.tmdb_id && tvDetailsCache[item.tmdb_id] ? tvDetailsCache[item.tmdb_id] : null;
        const upcomingBadge = tvDetails ? tvDetails.badge : null;

        let seasonOptions = '';
        let maxEpisodesInCurrentSeason = 30;

        if (tvDetails && tvDetails.seasons.length > 0) {
          tvDetails.seasons.forEach(s => {
            seasonOptions += `<option value="${s.season_number}" ${s.season_number == currentSeasonNum ? 'selected' : ''}>Temp. ${s.season_number}</option>`;
            if (s.season_number == currentSeasonNum) {
              maxEpisodesInCurrentSeason = s.episode_count || 30;
            }
          });
        } else {
          for (let s = 1; s <= 15; s++) {
            seasonOptions += `<option value="${s}" ${s == currentSeasonNum ? 'selected' : ''}>Temp. ${s}</option>`;
          }
        }

        const totalPending = isTV ? calculateTotalPending(item, tvDetails) : 0;

        let episodeOptions = '';
        for (let e = 1; e <= maxEpisodesInCurrentSeason; e++) {
          episodeOptions += `<option value="${e}" ${e == currentEpisodeNum ? 'selected' : ''}>Cap. ${e}</option>`;
        }
        
        const card = document.createElement('div');
        card.className = `card-style rounded-2xl overflow-hidden flex gap-4 p-3.5 relative ${isCompleted ? 'opacity-80 border-emerald-500/40 bg-slate-900/90' : ''}`;
        card.innerHTML = `
          <div class="relative flex-shrink-0">
            <img src="${item.poster}" class="w-24 h-36 object-cover rounded-xl border border-white/10 shadow-sm" alt="Poster" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Imagen'">
            
            ${isCompleted ? `
              <span class="absolute top-1 left-1 bg-emerald-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md shadow">VISTA</span>
            ` : (isTV && totalPending > 0 ? `
              <div title="${totalPending} capítulos pendientes en total" class="absolute -top-1.5 -left-1.5 bg-amber-400 text-slate-950 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-md border-2 border-slate-900 flex items-center gap-0.5">
                <span>Pendientes:</span> <span class="text-xs font-black">${totalPending}</span>
              </div>
            ` : '')}
          </div>

          <div class="flex-1 flex flex-col justify-between py-0.5">
            <div>
              <div class="flex justify-between items-start gap-1">
                <h3 class="font-bold text-sm text-white line-clamp-1">${item.title}</h3>
                <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-red-400 text-sm px-1 leading-none">&times;</button>
              </div>
              
              <div class="flex flex-wrap gap-1.5 items-center mt-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-pink-950/60 text-pink-300 border border-pink-500/30">
                  ${getCategoryLabel(item.category)}
                </span>
                <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-white/10">
                  ${isTV ? '📺 Serie' : '🎬 Película'}
                </span>
                ${upcomingBadge ? `
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${upcomingBadge.includes('Próx') ? 'bg-amber-950/70 text-amber-300 border border-amber-500/30' : (upcomingBadge.includes('Finalizada') ? 'bg-emerald-950/70 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-400 border border-white/10')}">
                    ${upcomingBadge}
                  </span>
                ` : ''}
              </div>

              <p class="text-xs text-slate-300 mt-2 leading-relaxed line-clamp-3">${item.overview || 'Sin descripción disponible.'}</p>
            </div>

            ${isTV ? `
              <div class="mt-2 bg-slate-950/80 p-1.5 rounded-xl flex items-center justify-between border border-white/10 gap-1.5">
                ${isCompleted ? `
                  <span class="text-xs text-emerald-400 font-semibold px-1">Temporada finalizada</span>
                  <button onclick="toggleCompleted(${item.id}, false)" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded-lg border border-white/10 font-medium">Reanudar</button>
                ` : `
                  <select onchange="updateSeasonDropdown(${item.id}, this.value)" class="bg-slate-800 text-white text-xs rounded-lg border border-white/10 p-1 focus:outline-none max-w-[85px]">
                    ${seasonOptions}
                  </select>
                  <select onchange="updateEpisodeDropdown(${item.id}, this.value)" class="bg-slate-800 text-white text-xs rounded-lg border border-white/10 p-1 focus:outline-none max-w-[75px]">
                    ${episodeOptions}
                  </select>
                  <button onclick="advanceNextEpisode(${item.id})" title="Siguiente capítulo" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1 rounded-lg border border-emerald-400/30 font-bold transition flex items-center gap-1 active:scale-95 shadow">
                    <span>▶</span>
                  </button>
                `}
              </div>
            ` : ''}

            <a href="${faSearchUrl}" target="_blank" class="mt-2 text-xs text-amber-400 hover:underline flex items-center gap-1 font-medium">
              <i class="fa-solid fa-star text-[10px]"></i> Ver en FilmAffinity
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Avanza automáticamente al siguiente capítulo o temporada
    async function advanceNextEpisode(id) {
      const item = mediaList.find(m => m.id === id);
      if (!item) return;

      const tvDetails = tvDetailsCache[item.tmdb_id];
      let currSeason = item.season || 1;
      let currEp = item.episode || 1;

      let maxEpisodesInCurrentSeason = 30;
      let totalSeasons = 15;

      if (tvDetails && tvDetails.seasons) {
        totalSeasons = tvDetails.seasons.length;
        const currentSData = tvDetails.seasons.find(s => s.season_number === currSeason);
        if (currentSData) {
          maxEpisodesInCurrentSeason = currentSData.episode_count || 30;
        }
      }

      if (currEp < maxEpisodesInCurrentSeason) {
        // Pasar al siguiente capítulo de la misma temporada
        await supabaseClient.from('media').update({ episode: currEp + 1 }).eq('id', id);
      } else if (currSeason < totalSeasons) {
        // Pasar al primer capítulo de la siguiente temporada
        await supabaseClient.from('media').update({ season: currSeason + 1, episode: 1 }).eq('id', id);
      } else {
        // Marcar como temporada finalizada si ya no hay más episodios
        await supabaseClient.from('media').update({ completed: true }).eq('id', id);
      }

      fetchMedia();
    }

    function getCategoryLabel(cat) {
      switch(cat) {
        case 'SERGIO': return '👦 Sergio';
        case 'ALAIA': return '👩 Alaia';
        case 'JUNTOS': return '👩‍❤️‍👨 Juntos';
        case 'NIÑA': return '👧 Con la Niña';
        default: return cat;
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = "filter-btn bg-slate-800 text-slate-300 px-4 py-1.5 rounded-full text-sm whitespace-nowrap font-medium border border-white/10";
      });
      const activeBtn = document.getElementById(`btn-${filter}`);
      if (activeBtn) activeBtn.className = "filter-btn bg-pink-600 text-white px-4 py-1.5 rounded-full text-sm whitespace-nowrap font-medium border border-white/20";
      renderList();
    }

    async function executeSearch(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('tmdb-search');
      const query = input.value.trim();
      const status = document.getElementById('status-msg');
      const resultsDiv = document.getElementById('search-results');

      if (!query) return;

      status.innerText = "Buscando...";
      status.classList.remove('hidden');
      resultsDiv.innerHTML = '';
      document.getElementById('selected-item-form').classList.add('hidden');

      let results = [];

      try {
        if (searchType === 'movie') {
          const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(query)}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.results && data.results.length > 0) {
              data.results.slice(0, 6).forEach(m => {
                results.push({
                  title: m.title,
                  type: 'movie',
                  tmdb_id: m.id,
                  poster: m.poster_path ? `https://image.tmdb.org/t/p/w300${m.poster_path}` : 'https://via.placeholder.com/200x300?text=Sin+Imagen',
                  overview: m.overview || 'Sin descripción disponible.'
                });
              });
            }
          }
        } else {
          const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(query)}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.results && data.results.length > 0) {
              data.results.slice(0, 6).forEach(s => {
                results.push({
                  title: s.name,
                  type: 'tv',
                  tmdb_id: s.id,
                  poster: s.poster_path ? `https://image.tmdb.org/t/p/w300${s.poster_path}` : 'https://via.placeholder.com/200x300?text=Sin+Imagen',
                  overview: s.overview || 'Sin descripción disponible.'
                });
              });
            }
          }
        }
      } catch (e) {
        console.error(e);
      }

      status.classList.add('hidden');

      if (results.length === 0) {
        resultsDiv.innerHTML = `
          <div class="text-center py-4">
            <p class="text-xs text-slate-400 mb-2">No se encontraron resultados para "${query}".</p>
            <button type="button" onclick="addManualItem()" class="bg-slate-800 text-pink-400 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold">
              + Añadir "${query}" manualmente como ${searchType === 'movie' ? 'Película' : 'Serie'}
            </button>
          </div>
        `;
        return;
      }

      results.forEach(item => {
        const row = document.createElement('div');
        row.className = "flex items-center gap-3 p-2 bg-slate-800 bg-opacity-60 rounded-xl cursor-pointer hover:bg-slate-800 transition border border-white/10";
        row.onclick = () => selectItem(item);

        row.innerHTML = `
          <img src="${item.poster}" class="w-10 h-14 object-cover rounded-md flex-shrink-0" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Imagen'">
          <div class="overflow-hidden flex-1">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold text-white truncate">${item.title}</h4>
              <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${item.type === 'movie' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-purple-500/20 text-purple-300 border border-purple-500/30'}">
                ${item.type === 'movie' ? '🎬 Película' : '📺 Serie'}
              </span>
            </div>
            <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${item.overview}</p>
          </div>
        `;
        resultsDiv.appendChild(row);
      });
    }

    function addManualItem() {
      const query = document.getElementById('tmdb-search').value.trim() || 'Nueva Entrada';
      selectItem({
        title: query,
        type: searchType,
        tmdb_id: null,
        poster: 'https://via.placeholder.com/200x300?text=' + encodeURIComponent(query),
        overview: 'Añadido manualmente.',
        season: 1,
        episode: 1
      });
    }

    function selectItem(item) {
      tempSelectedItem = item;
      document.getElementById('preview-img').src = item.poster;
      document.getElementById('preview-title').innerText = item.title;
      document.getElementById('preview-type').innerText = item.type === 'tv' ? '📺 Serie' : '🎬 Película';
      document.getElementById('selected-item-form').classList.remove('hidden');
    }

    async function saveSelectedItem() {
      if (!tempSelectedItem || !supabaseClient) return;
      
      const btn = document.getElementById('save-btn');
      btn.innerText = "Guardando...";
      btn.disabled = true;

      const category = document.querySelector('input[name="category"]:checked').value;
      
      const newItem = {
        title: tempSelectedItem.title,
        type: tempSelectedItem.type,
        poster: tempSelectedItem.poster,
        overview: tempSelectedItem.overview,
        category: category,
        episode: 1,
        completed: false,
        tmdb_id: tempSelectedItem.tmdb_id || null
      };

      const { error } = await supabaseClient.from('media').insert([newItem]);
      
      btn.innerText = "Guardar en la Lista";
      btn.disabled = false;

      if (!error) {
        tempSelectedItem = null;
        closeAddModal();
        fetchMedia();
      } else {
        alert("Error al guardar: " + error.message);
      }
    }

    async function toggleCompleted(id, status) {
      await supabaseClient.from('media').update({ completed: status }).eq('id', id);
      fetchMedia();
    }

    async function updateSeasonDropdown(id, newSeason) {
      await supabaseClient.from('media').update({ season: Number(newSeason), episode: 1, completed: false }).eq('id', id);
      fetchMedia();
    }

    async function updateEpisodeDropdown(id, newEp) {
      await supabaseClient.from('media').update({ episode: Number(newEp) }).eq('id', id);
      fetchMedia();
    }

    async function deleteItem(id) {
      await supabaseClient.from('media').delete().eq('id', id);
      fetchMedia();
    }

    if (currentUser) {
      selectUser(currentUser);
    } else {
      showUserSelection();
    }

    setInterval(fetchMedia, 5000);
  </script>
</body>
</html>
